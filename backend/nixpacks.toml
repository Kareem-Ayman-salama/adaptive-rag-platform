[phases.setup]
nixPkgs = [
  "python311",
  "python311Packages.pip"
]
aptPkgs = [
  "tesseract-ocr",
  "tesseract-ocr-ara",
  "libgl1",
  "libglib2.0-0"
]

[phases.install]
cmds = ["python -m pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "python -m uvicorn documind_rag.app.main:app --host 0.0.0.0 --port ${PORT}"
